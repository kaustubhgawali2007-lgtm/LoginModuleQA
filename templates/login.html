<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Online Movie Ticket Booking - Login</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f9;display:flex;justify-content:center;padding-top:40px;margin:0}
.card{background:#fff;padding:26px 30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);width:320px}
h1{font-size:19px;margin:0 0 14px;color:#1F3864;line-height:1.3}
label{display:block;margin-top:12px;font-size:14px}
input{width:100%;box-sizing:border-box;padding:8px;margin-top:4px;font-size:14px}
button{margin-top:18px;width:100%;padding:10px;background:#1F3864;color:#fff;border:0;border-radius:4px;font-size:15px}
.error{background:#fde2e2;color:#9b1c1c;padding:8px;border-radius:4px;margin-bottom:6px;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>Online Movie Ticket Booking<br>Login</h1>
{% if error %}<div class="error" id="error">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('login') }}" id="login-form">
<label for="username">Username</label>
<input type="text" id="username" name="username">
<label for="password">Password</label>
<input type="password" id="password" name="password">
<button type="submit" id="login-btn">Login</button>
</form>
</div>
</body>
</html>
